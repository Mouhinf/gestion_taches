services:
  - type: web
    name: gestion-taches
    env: php
    plan: starter
    region: oregon
    buildCommand: |
      # Install PHP dependencies (excluding dev packages)
      composer install --no-dev --optimize-autoloader
      # Install Node.js dependencies and compile assets with Laravel Mix
      npm ci
      npm run prod
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      # The following DB variables will be injected automatically by Render when you attach a MySQL service
      - key: DB_HOST
        fromService: mysql
        property: host
      - key: DB_PORT
        fromService: mysql
        property: port
      - key: DB_DATABASE
        fromService: mysql
        property: database
      - key: DB_USERNAME
        fromService: mysql
        property: user
      - key: DB_PASSWORD
        fromService: mysql
        property: password
    # Run migrations after the build completes
    postDeploy: |
      php artisan migrate --force
