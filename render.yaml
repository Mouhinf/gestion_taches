services:
  - type: web
    name: gestion-taches
    env: php
    plan: free
    region: oregon
    buildCommand: |
      # Installer les dépendances PHP (sans les dev)
      composer install --no-dev --optimize-autoloader
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      # Connexion PostgreSQL injectée automatiquement depuis le datastore ci-dessous
      - key: DB_HOST
        fromService:
          type: pgsql
          name: gestion-taches-db
          property: host
      - key: DB_PORT
        fromService:
          type: pgsql
          name: gestion-taches-db
          property: port
      - key: DB_DATABASE
        fromService:
          type: pgsql
          name: gestion-taches-db
          property: database
      - key: DB_USERNAME
        fromService:
          type: pgsql
          name: gestion-taches-db
          property: user
      - key: DB_PASSWORD
        fromService:
          type: pgsql
          name: gestion-taches-db
          property: password
    postDeploy: |
      php artisan migrate --force

databases:
  - name: gestion-taches-db
    type: pgsql
    plan: free
    region: oregon
